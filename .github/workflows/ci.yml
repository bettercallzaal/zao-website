name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # The guard. Every failure this site has shipped was SILENT - the build
      # stayed green and the pages returned 200 while the defect went live. The
      # steps above cannot see any of them, which is the entire reason this one
      # exists. It must run against a SERVED build, not the source.
      - name: Start the production build
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
      - name: Guard against silent regressions
        run: npm run check:site http://localhost:3000

# NOT RUN HERE, deliberately, and recorded rather than quietly skipped:
#   npm run lint        - eslint 9 with no config file in the repo. Adding the
#                         canonical Next flat config hits a circular-reference
#                         crash in @eslint/eslintrc against eslint-config-next 16.
#   npm run lint:biome  - biome is not installed; the script is dead.
# Both are pre-existing and neither was introduced here. Putting either in CI
# would make it red on arrival, which teaches people to ignore a red CI - worse
# than no CI. Fixing the lint toolchain is its own task.
