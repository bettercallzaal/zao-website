# Scheduled check of the LIVE site.
#
# WHY THIS EXISTS, separately from the CI guard. `ci.yml` runs the same guard,
# but only when code changes, and only against a build on localhost. Between
# merges nothing watches the deployed site at all - so a break that comes from
# OUTSIDE the code would go unnoticed until someone looked by hand. With the
# reveal on 13 September and possibly no more commits before it, "nobody looked"
# is the likely state, not the unlikely one.
#
# WHAT IT ASSERTS, and the second half matters as much as the first. Following
# the pattern in ZAODEVZ/ZAOstock's uptime.yml, whose lesson was that a
# wrong-but-reachable database answers 200 with an empty array: reachable is not
# the same as correct. So this does not ping the homepage - it runs the full
# guard against the live site, which fails if:
#   - any page is missing its og:image (the share card breaks silently)
#   - a linked page is absent from the sitemap
#   - any of the 81 live Webflow URLs stops resolving
# All three return 200 pages while being wrong, which is the point.
#
# CAVEATS, so nobody trusts this further than it goes:
#   - GitHub disables scheduled workflows after ~60 days without repository
#     activity. If this repo goes quiet that long, check the Actions tab.
#   - Cron is best-effort; runs get delayed or skipped under load.
#   - It opens an issue. It does not wake anyone. If the reveal needs a pager,
#     this is not it.
#   - It FOLLOWS THE CUTOVER on its own. Before the DNS switch it watches
#     test.thezao.com; once thezao.com is provably the new site it watches that
#     instead. This used to be a documented manual step, which is another way of
#     saying it would have been forgotten - leaving the watch passing forever
#     against a host nobody visits.
name: Uptime

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      site_url:
        description: >-
          Override the site to check. Exists so the ALERT PATH can be tested on
          demand - point it at a host that fails and confirm an issue is opened.
          An alerting branch that has never executed is an inverted alarm.
        required: false
        default: ''

permissions:
  contents: read
  issues: write

env:
  # A dispatch input always wins, so the failure path stays testable without
  # breaking the real site. Otherwise the host is DETECTED - see the step below.
  SITE_URL_OVERRIDE: ${{ inputs.site_url }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Pick the host to watch. Conservative on purpose: production is only
      # chosen when it is PROVABLY the new site, not merely reachable. Two
      # independent signals must agree - no x-wf-region header (Webflow is gone)
      # and a sitemap.xml that answers 200 (the Next app is really there).
      # Measured 2026-09-08: thezao.com gives x-wf-region=2 and sitemap 404, so
      # today this resolves to test.thezao.com.
      - name: Decide which host to watch
        id: host
        run: |
          set -uo pipefail
          if [ -n "${SITE_URL_OVERRIDE:-}" ]; then
            echo "url=$SITE_URL_OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Overridden by dispatch input: $SITE_URL_OVERRIDE"
            exit 0
          fi
          PROD="https://thezao.com"
          TEST="https://test.thezao.com"
          CODE="$(curl -sS -o /dev/null -L --max-time 20 -w '%{http_code}' "$PROD" || echo 000)"
          WF="$(curl -sSI -L --max-time 20 "$PROD" 2>/dev/null | grep -ci '^x-wf-region' || true)"
          SM="$(curl -sS -o /dev/null -L --max-time 20 -w '%{http_code}' "$PROD/sitemap.xml" || echo 000)"
          echo "thezao.com: code=$CODE x-wf-region=$WF sitemap=$SM"
          if [ "$CODE" = "200" ] && [ "$WF" = "0" ] && [ "$SM" = "200" ]; then
            echo "url=$PROD" >> "$GITHUB_OUTPUT"
            echo "Cutover detected - watching PRODUCTION $PROD"
          else
            echo "url=$TEST" >> "$GITHUB_OUTPUT"
            echo "Still on Webflow - watching $TEST"
          fi

      - name: Run the site guard against the live site
        id: check
        env:
          SITE_URL: ${{ steps.host.outputs.url }}
        run: |
          # GitHub runs `run:` under `bash -e`, so a failing pipeline kills the
          # step immediately. That is exactly the case we care about, and it was
          # aborting before the output could be captured - the alert fired with
          # an empty diagnostic block. Disable -e around the pipeline only.
          set -uo pipefail
          set +e
          OUT_FILE="$(mktemp)"
          node scripts/check-site.mjs "$SITE_URL" 2>&1 | tee "$OUT_FILE"
          STATUS="${PIPESTATUS[0]}"
          set -e
          OUT="$(head -c 4000 "$OUT_FILE")"
          {
            echo "status=$STATUS"
            echo "out<<OUT_EOF"
            echo "$OUT"
            echo "OUT_EOF"
          } >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Open an issue if the live site is failing
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.check.outputs.out }}
          SITE_URL: ${{ steps.host.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Uptime: the live site is failing the guard"

          # One open issue at a time. A check on a schedule must never turn an
          # outage into a stream of issues, and re-filing on a break nobody has
          # fixed yet adds nothing.
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq 'length')"
          if [ "$EXISTING" != "0" ]; then
            echo "Already tracked in an open issue. Not filing another."
            exit 0
          fi

          BODY_FILE="$(mktemp)"
          {
            printf '%s\n\n' "The scheduled guard failed against \`$SITE_URL\`."
            printf '%s ' "This does not mean the site is down - it means it is **reachable but wrong**"
            printf '%s ' "in one of the ways that returns 200 while being broken: a missing og:image,"
            printf '%s\n\n' "a linked page absent from the sitemap, or one of the 81 live Webflow URLs gone."
            printf '```\n%s\n```\n\n' "$OUT"
            printf '%s\n\n' "Run: $RUN_URL"
            printf '%s\n\n' "Reproduce locally:"
            printf '```sh\nnode scripts/check-site.mjs %s\n```\n' "$SITE_URL"
          } > "$BODY_FILE"

          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$BODY_FILE"
